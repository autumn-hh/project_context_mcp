<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-label="记 → 查 → 接着干">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c45c26"/>
      <stop offset="100%" stop-color="#e8a54b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="160" rx="16" fill="#0f1115"/>
  <!-- step 1 -->
  <rect x="40" y="36" width="220" height="88" rx="14" fill="#1a1d24" stroke="#e8a54b" stroke-opacity="0.45"/>
  <circle cx="78" cy="80" r="18" fill="url(#g)"/>
  <text x="78" y="86" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f1115">1</text>
  <text x="160" y="76" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5efe6">记</text>
  <text x="160" y="100" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#b8a890">索引 · 决定 · 检查点</text>
  <!-- arrow -->
  <path d="M278 80 L318 80" stroke="#e8a54b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M310 72 L322 80 L310 88" fill="none" stroke="#e8a54b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- step 2 -->
  <rect x="340" y="36" width="220" height="88" rx="14" fill="#1a1d24" stroke="#e8a54b" stroke-opacity="0.45"/>
  <circle cx="378" cy="80" r="18" fill="url(#g)"/>
  <text x="378" y="86" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f1115">2</text>
  <text x="460" y="76" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5efe6">查</text>
  <text x="460" y="100" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#b8a890">MCP 检索项目记忆</text>
  <!-- arrow -->
  <path d="M578 80 L618 80" stroke="#e8a54b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M610 72 L622 80 L610 88" fill="none" stroke="#e8a54b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- step 3 -->
  <rect x="640" y="36" width="280" height="88" rx="14" fill="#1a1d24" stroke="#e8a54b" stroke-opacity="0.55"/>
  <circle cx="678" cy="80" r="18" fill="url(#g)"/>
  <text x="678" y="86" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f1115">3</text>
  <text x="790" y="76" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f5efe6">接着干</text>
  <text x="790" y="100" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#b8a890">换会话也能续上</text>
</svg>
